# OpenResty snippet — pasang di reverse proxy depan aplikasi
# Target: ticketing-bpt.komdigi.go.id
# VAPT Finding 3: Missing Security Headers and Unencrypted Transport

# 1. Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ticketing-bpt.komdigi.go.id;
    return 301 https://$host$request_uri;
}

# 2. HTTPS upstream ke aplikasi (sesuaikan IP/port internal)
server {
    listen 443 ssl http2;
    server_name ticketing-bpt.komdigi.go.id;

    # Ganti path sertifikat resmi Komdigi / Let's Encrypt
    ssl_certificate     /etc/ssl/certs/ticketing-bpt.komdigi.go.id.crt;
    ssl_certificate_key /etc/ssl/private/ticketing-bpt.komdigi.go.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers (WAJIB — temuan VAPT)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com/recaptcha/ https://www.gstatic.com/ https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; frame-src 'self' https://www.google.com/recaptcha/ https://challenges.cloudflare.com; connect-src 'self' https://www.google.com/recaptcha/ https://challenges.cloudflare.com;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        # JANGAN proxy langsung ke :3000 dari internet
        # Proxy ke nginx internal Docker atau app internal
        proxy_pass http://127.0.0.1:8080;  # sesuaikan
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# PENTING: Tutup akses publik ke port 3000
# firewall / security group: block inbound TCP 3000 dari 0.0.0.0/0
